schema_version: 1

context:
  name: graphrag
  version: 3.1.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/graphrag-${{ version }}.tar.gz
  sha256: a458f9403bf982b4620d751e974d9f37936e047aa054a508f4338950b0eed20d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - typer >=0.16,<1.dev0
    - typing_extensions >=4.12,<5.dev0
    - pandas >=2.3,<3.dev0
    - pyarrow >=22.0,<23.dev0
    - json-repair >=0.30,<1.dev0
    - python >=${{ python_min }},<3.13
    - azure-search-documents >=11.5,<12.dev0
    - nltk >=3.9,<4.dev0
    - numpy >=2.1,<3.dev0
    - networkx >=3.4,<4.dev0
    - pydantic >=2.10,<3.dev0
    - azure-storage-blob >=12.24,<13.dev0
    - azure-identity >=1.25,<2.dev0
    - cython-blis >=1.0,<2.dev0
    - devtools >=0.12,<1.dev0
    - graphrag-llm ==3.1.0
    - graphrag-chunking ==3.1.0
    - tqdm >=4.67,<5.dev0
    - graspologic-native >=1.2,<2.dev0
    - graphrag-common ==3.1.0
    - graphrag-cache ==3.1.0
    - spacy >=3.8,<4.dev0
    - textblob >=0.18,<1.dev0
    - graphrag-storage ==3.1.0
    - graphrag-vectors ==3.1.0
    - graphrag-input ==3.1.0
tests:
  - python:
      imports:
        - graphrag
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A modular graph-based Retrieval-Augmented Generation (RAG) system
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/microsoft/graphrag

extra:
  recipe-maintainers:
    - jan-janssen
